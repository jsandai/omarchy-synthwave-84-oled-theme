# Neon text glow for Ghostty, loaded only by users who ran glow/install.sh. Their
# Ghostty config includes this file from the current theme, so it applies only
# while synthwave-84-oled is the theme. Animation off: the shader is static, so
# it only needs to run when the terminal redraws.
custom-shader = neon-glow.glsl
custom-shader-animation = false
